plugins {
    id 'fabric-loom' version '1.10.2'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenLocal()
    mavenCentral()
    maven { url "https://maven.fabricmc.net/" }
    maven { url "https://maven.terraformersmc.com/releases/" }
    flatDir {
        dirs 'e:/Minecraft Project/Dasik Library v1.20.1/Archive Jar of all versions/MC 1.20.1'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    modImplementation "net.dasik.social:dasik-library:${project.dasik_library_version}"

    // Optional GUI Dependencies
    modCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
    testImplementation "com.terraformersmc:modmenu:${project.modmenu_version}"

    testImplementation "org.junit.jupiter:junit-jupiter-api:5.10.0"
    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:5.10.0"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.10.0"
}

loom {
    accessWidenerPath = file("src/main/resources/magnet.accesswidener")
    mixin {
        defaultRefmapName = "ig_magnet.refmap.json"
        useLegacyMixinAp = true
    }
}

processResources {
    inputs.property "version", project.version
    inputs.property "loader_version", project.fabric_loader_version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "minecraft_dependency", project.minecraft_dependency

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
               "loader_version": project.fabric_loader_version,
               "minecraft_version": project.minecraft_version,
               "minecraft_dependency": project.minecraft_dependency
    }
}

test {
    useJUnitPlatform()
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = 17
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
    manifest {
        attributes(
            'Implementation-Title': project.archives_base_name,
            'Implementation-Version': project.mod_version,
            'Implementation-Vendor': 'Dasik (Rifaditya)',
            'X-Origin-Author': 'Dasik (Rifaditya)',
            'X-Origin-Repository': 'https://github.com/Rifaditya',
            'X-Origin-License': 'GNU GPLv3'
        )
    }
}

tasks.register('archiveReleaseJar') {
    dependsOn 'remapJar'
    doLast {
        def targetSubdir = "MC 1.20.1"
        def localArchiveDir = file("${project.rootDir}/../Archive Jar of all versions/${targetSubdir}")
        def centralHubDir = file("e:/Minecraft Project/minecraft-mod-release-hub/archives/Magnet")
        def vaultDir = new File("D:/Minecraft Mod Archive Jars/Magnet")
        def profileDir = new File(System.getProperty("user.home"), "AppData/Roaming/ModrinthApp/profiles/Fabric 1.20.1/mods")

        def builtJar = remapJar.archiveFile.get().asFile
        if (builtJar.exists()) {
            [localArchiveDir, centralHubDir].each { dir ->
                dir.mkdirs()
                copy {
                    from builtJar
                    into dir
                }
                println "[AUTO-ARCHIVE] Successfully copied ${builtJar.name} to ${dir.absolutePath}"
            }

            try {
                if (vaultDir.exists() || new File("D:/").exists()) {
                    vaultDir.mkdirs()
                    copy {
                        from builtJar
                        into vaultDir
                    }
                    println "[VAULT-ARCHIVE] Successfully copied ${builtJar.name} to external vault: ${vaultDir.absolutePath}"
                }
            } catch (Exception e) {
                println "[VAULT-ARCHIVE] Note: Could not copy to external vault: ${e.message}"
            }

            if (profileDir.exists()) {
                profileDir.listFiles().each { file ->
                    if (file.name.toLowerCase().contains("magnet") && file.name.endsWith(".jar") && !file.name.equals(builtJar.name)) {
                        file.delete()
                        println "[MODRINTH-SYNC] Purged old version from launcher profile: ${file.name}"
                    }
                }
                copy {
                    from builtJar
                    into profileDir
                }
                println "[MODRINTH-SYNC] Deployed ${builtJar.name} to ${profileDir.absolutePath}"
            }
        }
    }
}

build.finalizedBy('archiveReleaseJar')
