plugins {
    id 'net.fabricmc.fabric-loom' version '1.15.5'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenLocal()
    maven { url = "https://maven.fabricmc.net/" }
    maven { url = "https://maven.terraformersmc.com/releases/" }
    maven { url = "https://maven.shedaniel.me/" }
    maven { url = "https://maven.isxander.dev/releases" }
    maven { url = "https://api.modrinth.com/maven" }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"

    implementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    implementation ("net.dasik.social:dasik-library:${project.dasik_library_version}") {
        exclude group: "net.fabricmc.fabric-api"
        exclude group: "net.fabricmc"
    }

    // Optional GUI Dependencies (compile-only required, runtime-optional for players)
    compileOnly "dev.isxander:yet-another-config-lib:3.9.5+26.2-fabric"
    runtimeOnly "dev.isxander:yet-another-config-lib:3.9.5+26.2-fabric"

    compileOnly "com.terraformersmc:modmenu:18.0.0-beta.1"
    runtimeOnly "com.terraformersmc:modmenu:18.0.0-beta.1"

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

processResources {
    inputs.property "version", project.version
    inputs.property "loader_version", project.fabric_loader_version
    inputs.property "minecraft_version", project.minecraft_version
    filesMatching("fabric.mod.json") {
        expand "version": project.version,
               "loader_version": project.fabric_loader_version,
               "minecraft_version": project.minecraft_version
    }
}

loom {
    accessWidenerPath = file("src/main/resources/magnet.accesswidener")
}

java {
    withSourcesJar()
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

tasks.register('archiveReleaseJar') {
    dependsOn 'build'
    doLast {
        def mcVer = project.hasProperty('minecraft_version') ? project.minecraft_version.toString() : ""
        def targetSubdir = mcVer.startsWith("26.3") ? "MC 26.3" :
                           mcVer.startsWith("26.2") ? "MC 26.2" :
                           mcVer.startsWith("26.1") ? "MC 26.1" :
                           mcVer.startsWith("1.21.11") ? "MC 1.21.11" :
                           mcVer.startsWith("1.21") ? "MC 1.21.1" :
                           mcVer.startsWith("1.20") ? "MC 1.20.1" : "MC Unknown"

        // 1. Central Versioned Archive
        def archiveDir = file("${project.rootDir}/../../Archive Jar of all versions/${targetSubdir}")
        archiveDir.mkdirs()
        def jarFile = tasks.named('jar', Jar).get().archiveFile.get().asFile
        if (jarFile.exists()) {
            copy {
                from jarFile
                into archiveDir
            }
            println "[AUTO-ARCHIVE] Successfully copied ${jarFile.name} to central Archive directory: ${archiveDir.absolutePath}"
        }

        // 2. Dynamic Modrinth Profile Sync (Strictly matching target Minecraft version)
        def targetProfiles = mcVer.startsWith("26.3") ? [
            file("C:/Users/fmrif/AppData/Roaming/ModrinthApp/profiles/Fabric 26.3ish/mods")
        ] : mcVer.startsWith("26.2") ? [
            file("C:/Users/fmrif/AppData/Roaming/ModrinthApp/profiles/Fabric 26.2 (1)/mods"),
            file("C:/Users/fmrif/AppData/Roaming/ModrinthApp/profiles/Fabric 26.x test the latest/mods")
        ] : mcVer.startsWith("26.1") ? [
            file("C:/Users/fmrif/AppData/Roaming/ModrinthApp/profiles/Fabric 26.1.2/mods")
        ] : mcVer.startsWith("1.21.11") ? [
            file("C:/Users/fmrif/AppData/Roaming/ModrinthApp/profiles/Fabric 1.21.11/mods")
        ] : mcVer.startsWith("1.21") ? [
            file("C:/Users/fmrif/AppData/Roaming/ModrinthApp/profiles/Fabric 1.21.1/mods")
        ] : mcVer.startsWith("1.20") ? [
            file("C:/Users/fmrif/AppData/Roaming/ModrinthApp/profiles/Fabric 1.20.1/mods")
        ] : []

        targetProfiles.each { profileMods ->
            if (profileMods.exists()) {
                profileMods.listFiles().each { file ->
                    if (file.name.startsWith(project.archives_base_name) && file.name.endsWith(".jar") && !file.name.equals(jarFile.name)) {
                        file.delete()
                        println "[MODRINTH-SYNC] Purged old version from launcher profile: ${file.name}"
                    }
                }
                copy {
                    from jarFile
                    into profileMods
                }
                println "[MODRINTH-SYNC] Deployed ${jarFile.name} to ${profileMods.absolutePath}"
            }
        }

        // 3. Central Release Hub Archives Sync
        File hubCandidate = projectDir
        File hubDir = null
        while (hubCandidate != null) {
            File checkDir = new File(hubCandidate, "minecraft-mod-release-hub")
            if (checkDir.exists()) {
                hubDir = checkDir
                break
            }
            hubCandidate = hubCandidate.parentFile
        }
        if (hubDir == null) {
            File fallback = new File("E:/Minecraft Project/minecraft-mod-release-hub")
            if (fallback.exists()) hubDir = fallback
        }
        if (hubDir != null && hubDir.exists()) {
            File hubConfigFile = new File(hubDir, "config/platform_projects.json")
            if (hubConfigFile.exists()) {
                try {
                    def hubJson = new groovy.json.JsonSlurper().parse(hubConfigFile)
                    def curPath = projectDir.canonicalPath.replace('\\', '/').toLowerCase()
                    def matchedMod = hubJson.find { name, data ->
                        data.root_dir && curPath.contains(data.root_dir.replace('\\', '/').toLowerCase())
                    }?.key
                    if (matchedMod) {
                        File targetArchiveDir = new File(hubDir, "archives/${matchedMod}")
                        if (!targetArchiveDir.exists()) {
                            targetArchiveDir.mkdirs()
                        }
                        def targetFileToCopy = (tasks.findByName('remapJar') ?: tasks.findByName('jar')).archiveFile.get().asFile
                        copy {
                            from targetFileToCopy
                            into targetArchiveDir
                        }
                        println "[HUB-ARCHIVE] Successfully copied ${targetFileToCopy.name} to release hub archives: ${targetArchiveDir.canonicalPath}"
                    }
                } catch (Exception e) {
                    println "[HUB-ARCHIVE] Note: Could not copy to release hub: ${e.message}"
                }
            }
        }
    }
}

tasks.named('build') {
    finalizedBy 'archiveReleaseJar'
}
